# /etc/nginx/sites-available/northread
# 把 northread.example.com 换成你的域名。
#
# HTTPS 证书用 certbot 签：
#   sudo certbot --nginx -d northread.example.com
# 它会自动改写这个文件加上 443 段和证书路径。

server {
    listen 80;
    server_name northread.example.com;

    # certbot 跑完之后这一段会变成跳转到 443
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Server Actions 和登录 cookie 依赖这些头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 抓取和生成推荐可能跑几分钟，别让反代提前掐断
        proxy_read_timeout 300s;
    }

    # 别把静态资源交给 Next 的开发服务器逻辑
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
