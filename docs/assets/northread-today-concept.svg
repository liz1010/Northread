<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Northread 今日首页概念图">
  <title>Northread — 今日</title>
  <desc>核心页面。一条最值得读的、两条有时间再读的、今天过滤掉了什么、本周目标进展，以及昨天的阅读留下了什么。没有信息流，没有未读数。界面中文，内容中英文都支持。配色：纸与陶。</desc>

  <style><![CDATA[
    /* ================================================================
       设计 token —— 纸与陶 Paper & Clay（与工作台概念图完全一致）
       只在这里改颜色。下面的图形没有任何硬编码色值。

       clay 陶土 = “现在就做”  品牌、当前导航、目标匹配分、主按钮
       pine 墨绿 = “目标线索”  一切把内容和目标连起来的元素
       强调色预算：每屏最多 5 处陶土。本页用了 4 处。
       ================================================================ */
    :root {
      --ui:    'Inter', 'SF Pro Text', system-ui, -apple-system, 'Segoe UI',
               'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
               'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Micro Hei', sans-serif;
      --serif: 'Source Serif 4', 'Charter', 'Iowan Old Style', Georgia,
               'Songti SC', 'Noto Serif CJK SC', 'Source Han Serif SC', serif;

      --ink-900:  #16130F;
      --ink-700:  #3A342C;
      --ink-500:  #6E655A;
      --ink-300:  #C9C0B2;
      --ink-200:  #E5DED2;
      --ink-100:  #F2EDE4;
      --surface:  #FDFBF7;
      --canvas:   #F8F5EE;

      --clay-700: #A24B2E;
      --clay-100: #F6E5DC;
      --on-clay:  #FFFFFF;

      --pine-700: #2A4A3F;
      --pine-100: #E8EEEA;
    }

    text { font-family: var(--ui); fill: var(--ink-900); }

    .canvas  { fill: var(--canvas); }
    .surface { fill: var(--surface); }
    .hair    { stroke: var(--ink-200); stroke-width: 1; }
    .card    { fill: var(--surface); stroke: var(--ink-200); stroke-width: 1; }
    .sunken  { fill: var(--canvas); stroke: var(--ink-200); stroke-width: 1; }

    .cap     { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: var(--ink-500); }
    .cap-s   { font-size: 9px;  font-weight: 600; letter-spacing: .08em; fill: var(--ink-500); }
    .brand   { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
    .page-h  { font-size: 30px; font-weight: 600; letter-spacing: -.4px; }
    .t-15    { font-size: 15px; }
    .t-14    { font-size: 14px; }
    .t-13    { font-size: 13px; }
    .t-12    { font-size: 12px; }
    .t-115   { font-size: 11.5px; }
    .t-11    { font-size: 11px; }
    .mut     { fill: var(--ink-500); }
    .mut-2   { fill: var(--ink-300); }
    .semi    { font-weight: 600; }
    .med     { font-weight: 500; }
    .end     { text-anchor: end; }
    .mid     { text-anchor: middle; }

    .art-h   { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -.3px; }

    .clay-f    { fill: var(--clay-700); }
    .clay-tint { fill: var(--clay-100); }
    .clay-tx   { fill: var(--clay-700); }
    .on-clay   { fill: var(--on-clay); }

    .pine-f    { fill: var(--pine-700); }
    .pine-tint { fill: var(--pine-100); }
    .pine-tx   { fill: var(--pine-700); }

    .icon    { fill: none; stroke: var(--ink-500); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-d  { fill: none; stroke: var(--ink-300); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-c  { fill: none; stroke: var(--clay-700); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-p  { fill: none; stroke: var(--pine-700); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    .chip    { fill: var(--surface); stroke: var(--ink-200); stroke-width: 1; }
    .chip-tx { font-size: 11px; fill: var(--ink-500); }
    .track   { fill: var(--ink-200); }
    .meter   { fill: var(--ink-500); }

    .arc-t   { fill: none; stroke: var(--ink-200);  stroke-width: 5.5; }
    .arc-v   { fill: none; stroke: var(--clay-700); stroke-width: 5.5; stroke-linecap: round; }

    .thumb   { fill: var(--ink-100); stroke: var(--ink-200); stroke-width: 1; }
  ]]></style>

